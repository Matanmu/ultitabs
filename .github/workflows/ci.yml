name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm --filter ultitabs format:check

      - name: Lint
        run: pnpm --filter ultitabs lint

      - name: Type check
        run: pnpm --filter ultitabs typecheck

      - name: Test with coverage
        run: pnpm --filter ultitabs test:coverage

      - name: Build
        run: pnpm build

      - name: Size check
        run: pnpm --filter ultitabs size
